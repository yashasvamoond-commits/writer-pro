name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/*']

permissions:
  contents: write

jobs:
  apk:
    name: Build & publish APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web core (dist/)
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate / prepare Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            for cand in /usr/local/lib/android/sdk /opt/android/sdk $HOME/android-sdk; do
              [ -d "$cand" ] && echo "ANDROID_HOME=$cand" >> $GITHUB_ENV && export ANDROID_HOME=$cand && break
            done
          fi
          if [ ! -d "${ANDROID_HOME:-/nonexistent}" ]; then
            mkdir -p $HOME/android-sdk/cmdline-tools && cd $HOME/android-sdk/cmdline-tools
            curl -fsSL -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q tools.zip && mv cmdline-tools latest
            echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
            export ANDROID_HOME=$HOME/android-sdk
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Accept SDK licenses & ensure required components
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          SDKM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" "build-tools;35.0.0" || true
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Generate native Android project
        run: npx cap add android

      - name: Sync web core into Android project
        run: npx cap sync android

      - name: Assemble debug APK
        run: |
          cd android
          echo "sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk writer-pro-legal-drafter.apk
          ls -la writer-pro-legal-drafter.apk

      - uses: actions/upload-artifact@v4
        with:
          name: writer-pro-apk
          path: writer-pro-legal-drafter.apk

      - name: Publish release with APK download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Writer Pro Legal Drafter APK (build ${{ github.run_number }})
          body: |
            Install on any Android phone/tablet (7.0+):
            1. Download `writer-pro-legal-drafter.apk` below.
            2. Allow "install unknown apps" for your browser/file manager when prompted.
            3. Open the APK and install. Works fully offline.
          files: writer-pro-legal-drafter.apk
          make_latest: true
